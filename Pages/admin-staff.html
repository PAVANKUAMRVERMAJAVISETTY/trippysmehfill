<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Accounts - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans min-h-screen p-4 md:p-6">

  <!-- Admin Central Navigation -->
  <nav class="bg-amber-900 text-amber-100 p-4 rounded-2xl shadow-xl max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2 mb-6">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-black text-amber-400">TRIPPY'S MEHFILL</span>
      <span class="text-xs bg-amber-800 text-amber-200 px-2.5 py-1 rounded-full font-bold">Admin Portal</span>
    </div>
    <div class="flex space-x-2 text-xs font-bold flex-wrap gap-1">
      <a href="admin-dispatch.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🛵 Dispatch Desk</a>
      <a href="admin.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">📊 Analytics</a>
      <a href="admin-menu.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🍲 Menu Management</a>
      <a href="admin-orders.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">📜 Order History</a>
      <a href="admin-staff.html" class="px-3 py-1.5 rounded-lg bg-amber-800 text-amber-200 border border-amber-600 shadow">🔑 Staff Accounts</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto space-y-6">

    <!-- Register Staff Form Card -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-100 space-y-4 max-w-2xl mx-auto">
      <div class="border-b pb-2">
        <h2 class="font-black text-amber-950 text-lg">🔑 Register New Staff Account</h2>
        <p class="text-[10px] text-amber-800 font-bold uppercase mt-0.5">Kitchen Admins, Chefs & Drivers</p>
      </div>

      <div class="grid sm:grid-cols-2 gap-4 text-xs">
        <div>
          <label class="block font-bold text-gray-700 mb-1">Full Name</label>
          <input id="staff-name" type="text" placeholder="e.g. Ravi Kumar" class="w-full border p-3 rounded-xl outline-none focus:border-amber-800 font-semibold">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Select System Role</label>
          <select id="staff-role" class="w-full border p-3 rounded-xl outline-none bg-white font-bold text-gray-700">
            <option value="staff">🍳 Kitchen Manager (Staff)</option>
            <option value="driver">🛵 Delivery Partner (Driver)</option>
            <option value="admin">🔑 System Administrator (Admin)</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Email Address</label>
          <input id="staff-email" type="email" placeholder="staff@email.com" class="w-full border p-3 rounded-xl outline-none focus:border-amber-800 font-semibold">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Password</label>
          <input id="staff-password" type="password" placeholder="Minimum 6 characters" class="w-full border p-3 rounded-xl outline-none focus:border-amber-800 font-semibold">
        </div>
      </div>

      <button id="btn-save-staff" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3.5 rounded-xl shadow transition active:scale-95 text-xs">
        💾 Save Staff Credentials
      </button>
    </div>

  </main>

  <script type="module" src="../JS/admin-staff.js"></script>
</body>
</html>
