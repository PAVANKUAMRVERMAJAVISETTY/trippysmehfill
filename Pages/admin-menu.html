<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans min-h-screen p-4 md:p-6">

  <!-- Admin Central Navigation -->
  <nav class="bg-amber-900 text-amber-100 p-4 rounded-2xl shadow-xl max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2 mb-6">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-black text-amber-400">TRIPPY'S MEHFILL</span>
      <span class="text-xs bg-amber-800 text-amber-200 px-2.5 py-1 rounded-full font-bold">Menu Manager</span>
    </div>
    <div class="flex space-x-2 text-xs font-bold">
      <a href="admin.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">📊 Dashboard</a>
      <a href="admin-dispatch.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🛵 Dispatch Desk</a>
      <a href="admin-menu.html" class="px-3 py-1.5 rounded-lg bg-amber-800 text-amber-200 border border-amber-600 shadow">🍲 Menu Management</a>
      <a href="gallery.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🖼️ Gallery Uploads</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto space-y-6">

    <!-- Add Dish Form Panel -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-100 space-y-4 max-w-3xl mx-auto">
      <div class="border-b pb-2 flex justify-between items-center">
        <h2 id="form-title" class="font-black text-amber-950 text-lg">➕ Add New Dish to Menu</h2>
      </div>

      <div class="grid sm:grid-cols-2 gap-3 text-xs">
        <div>
          <label for="dish-name" class="block font-bold text-gray-700 mb-1">Dish Name</label>
          <input id="dish-name" name="dish-name" type="text" placeholder="e.g. Hyderabadi Dum Biryani" class="w-full border p-2.5 rounded-xl outline-none font-semibold">
        </div>

        <div>
          <label for="dish-price" class="block font-bold text-gray-700 mb-1">Price (₹)</label>
          <input id="dish-price" name="dish-price" type="number" placeholder="e.g. 180" class="w-full border p-2.5 rounded-xl outline-none font-semibold">
        </div>

        <div class="sm:col-span-2">
          <label for="dish-file" class="block font-bold text-gray-700 mb-1">Food Image (Uploads to menu-bucket)</label>
          <input id="dish-file" name="dish-file" type="file" accept="image/*" class="w-full border p-2 rounded-xl text-xs bg-gray-50">
        </div>

        <div class="sm:col-span-2">
          <label for="dish-desc" class="block font-bold text-gray-700 mb-1">Description / Ingredients</label>
          <input id="dish-desc" name="dish-desc" type="text" placeholder="e.g. Slow cooked with aromatic spices and saffron basmati rice" class="w-full border p-2.5 rounded-xl outline-none">
        </div>
      </div>

      <button id="btn-save-dish" type="button" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3 rounded-xl shadow transition text-xs cursor-pointer">
        💾 Save Dish to Supabase Menu
      </button>
    </div>

    <!-- Menu Control List -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-100 space-y-4 max-w-4xl mx-auto">
      <h2 class="font-bold text-amber-950 text-base border-b pb-2">Active Menu Items</h2>
      <div id="admin-menu-list" class="space-y-3">
        <p class="text-gray-400 text-center py-6">Loading menu items...</p>
      </div>
    </div>

  </main>

  <script type="module" src="../JS/admin-menu.js"></script>
</body>
</html>
