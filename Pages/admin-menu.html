<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans min-h-screen p-4 md:p-6">

  <!-- Admin Central Navigation -->
  <nav class="bg-amber-900 text-amber-100 p-4 rounded-2xl shadow-xl max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2 mb-6">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-black text-amber-400">TRIPPY'S MEHFILL</span>
      <span class="text-xs bg-amber-800 text-amber-200 px-2.5 py-1 rounded-full font-bold">Menu Manager</span>
    </div>
    <div class="flex space-x-2 text-xs font-bold">
      <a href="admin-dispatch.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🛵 Dispatch Desk</a>
      <a href="admin.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">📊 Analytics</a>
      <a href="admin-menu.html" class="px-3 py-1.5 rounded-lg bg-amber-800 text-amber-200 border border-amber-600 shadow">🍲 Menu Management</a>
      <a href="admin-staff.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🔑 Staff Accounts</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto space-y-6">

    <!-- Add/Edit Form Panel -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-100 space-y-4 max-w-3xl mx-auto">
      <div class="border-b pb-2 flex justify-between items-center">
        <h2 id="form-title" class="font-black text-amber-950 text-lg">➕ Add New Dish to Menu</h2>
        <button id="btn-cancel-edit" class="hidden text-xs bg-gray-200 text-gray-700 px-2.5 py-1 rounded-lg font-bold">Cancel Edit</button>
      </div>

      <input type="hidden" id="edit-item-id">

      <div class="grid sm:grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block font-bold text-gray-700 mb-1">Dish Name</label>
          <input id="dish-name" type="text" placeholder="e.g. Chicken Dum Biryani" class="w-full border p-2.5 rounded-xl outline-none focus:border-amber-800 font-semibold text-gray-850">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Price (₹)</label>
          <input id="dish-price" type="number" placeholder="e.g. 180" class="w-full border p-2.5 rounded-xl outline-none focus:border-amber-800 font-semibold text-gray-850">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Category</label>
          <select id="dish-category" class="w-full border p-2.5 rounded-xl outline-none bg-white font-bold text-gray-700">
            <option value="Non-Veg">🔴 Non-Vegetarian</option>
            <option value="Veg">🟢 Vegetarian</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Initial Visibility</label>
          <select id="dish-available" class="w-full border p-2.5 rounded-xl outline-none bg-white font-bold text-gray-700">
            <option value="true">☑️ Visible to Customers</option>
            <option value="false">❌ Hidden (Out of Stock)</option>
          </select>
        </div>

        <div class="sm:col-span-2">
          <label class="block font-bold text-gray-700 mb-1">Description / Ingredients</label>
          <input id="dish-desc" type="text" placeholder="e.g. Slow-cooked on dum with tender chicken, boiled egg and mint" class="w-full border p-2.5 rounded-xl outline-none focus:border-amber-800 text-gray-850">
        </div>
      </div>

      <button id="btn-save-dish" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3 rounded-xl shadow transition text-xs active:scale-95">
        💾 Save Dish to Menu
      </button>
    </div>

    <!-- Active Menu Items Controller List -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-100 space-y-4 max-w-4xl mx-auto">
      <div class="flex justify-between items-center border-b pb-2 border-amber-200">
        <h2 class="font-bold text-amber-950 text-base">Current Menu Control List</h2>
        <button id="btn-reset-default-menu" class="text-xs bg-amber-100 text-amber-900 hover:bg-amber-200 font-bold px-3 py-1.5 rounded-lg border border-amber-300 transition">
          🔄 Restore Default Hyderabadi Menu
        </button>
      </div>

      <div id="admin-menu-list" class="space-y-3">
        <p class="text-gray-400 text-center py-6">Connecting to database...</p>
      </div>
    </div>

  </main>

  <script type="module" src="../JS/admin-menu.js"></script>
</body>
</html>
