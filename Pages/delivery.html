<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Dispatch Queue - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans min-h-screen p-4 md:p-6 flex flex-col justify-between">

  <!-- Driver Login Block -->
  <div id="delivery-login-box" class="w-full max-w-md bg-white p-6 rounded-3xl shadow-xl border border-amber-100 space-y-6 mx-auto my-auto">
    <div class="text-center border-b pb-4 space-y-1">
      <h1 class="text-xl font-black text-amber-950">TRIPPY'S DRIVERS</h1>
      <p class="text-[10px] text-amber-800 font-bold uppercase">Delivery Boy Login Gate</p>
    </div>
    <div class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-gray-700 mb-1">User ID</label>
        <input id="delivery-username" type="text" placeholder="Enter your Driver ID" class="w-full border p-3 rounded-xl outline-none focus:border-amber-800 font-semibold">
      </div>
      <div>
        <label class="block font-bold text-gray-700 mb-1">Password</label>
        <input id="delivery-pass" type="password" placeholder="Enter your Driver password" class="w-full border p-3 rounded-xl outline-none focus:border-amber-800 font-semibold">
      </div>
      <button id="btn-driver-login" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3.5 rounded-xl shadow transition">
        🚀 Log In to Dispatch Queue
      </button>
    </div>
  </div>

  <!-- Driver Main Dashboard (Hidden until login succeeds) -->
  <div id="delivery-main-content" class="hidden w-full max-w-4xl mx-auto space-y-6">
    <nav class="bg-amber-900 text-amber-100 p-4 rounded-2xl shadow-xl flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-lg font-black text-amber-400">TRIPPY'S MEHFILL</span>
        <span class="text-[10px] bg-amber-800 text-amber-200 px-2 py-0.5 rounded-full font-bold">Delivery desk</span>
      </div>
      <span id="driver-welcome-name" class="text-xs font-bold text-amber-200">Welcome Driver</span>
    </nav>

    <div class="grid md:grid-cols-3 gap-6">
      <!-- Stats Sidebar -->
      <div class="space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-md border border-amber-100 text-center space-y-1">
          <p class="text-xs text-gray-500 uppercase font-bold">COD Cash Collected Today</p>
          <p id="driver-total-cash" class="text-2xl font-black text-green-700">₹0</p>
        </div>
      </div>

      <!-- Active Deliveries Queue -->
      <div class="md:col-span-2 space-y-4">
        <h2 class="text-lg font-bold text-amber-950 border-b pb-2 flex justify-between items-center">
          <span>Active Assigned Dispatches</span>
        </h2>
        <div id="driver-assigned-cards" class="grid sm:grid-cols-2 gap-4">
          <!-- Active orders will load here -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../JS/delivery.js"></script>
</body>
</html>
