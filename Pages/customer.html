<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Food - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-amber-50/30 text-gray-800 font-sans min-h-screen">

  <nav class="bg-amber-900 text-amber-100 p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="text-xl font-black text-amber-400">TRIPPY'S MEHFILL</a>
      <a href="../index.html" class="text-xs bg-amber-800 text-amber-200 px-3 py-1 rounded">← Main Hub</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
    <div id="customer-special-banner" class="bg-gradient-to-r from-amber-900 via-amber-800 to-amber-900 text-white rounded-2xl p-6 shadow-md border-b-4 border-amber-600">
      <span class="bg-amber-500 text-amber-950 font-black text-xs px-2.5 py-1 rounded-full uppercase">🔥 Today's Special Dish</span>
      <h1 id="banner-special-text" class="text-2xl md:text-3xl font-extrabold text-amber-300 mt-2">Special Hyderabadi Keema Khichdi & Dum Biryani Combo!</h1>
      <p class="text-amber-100 text-xs mt-1">Freshly Prepared • Authentic Flavors • Fast Campus Delivery</p>
    </div>

    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-xl font-bold text-amber-950 border-b border-amber-200 pb-2">Today's Available Menu</h2>
        <div id="menu-container" class="grid sm:grid-cols-2 gap-4"></div>
      </div>

      <div class="space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-md border border-amber-100 space-y-4 sticky top-20">
          <h2 class="text-lg font-bold text-amber-950 border-b pb-2 flex justify-between items-center">
            <span>Your Cart</span>
            <span id="cart-count" class="text-xs bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full">0 Items</span>
          </h2>

          <div id="cart-items" class="space-y-2 text-sm max-h-40 overflow-y-auto pr-1">
            <p class="text-gray-400 text-center py-4">Your cart is empty.</p>
          </div>

          <div class="border-t pt-3 space-y-2">
            <label class="block text-xs font-bold text-gray-700">Food Preferences & Suggestions</label>
            <div class="flex flex-wrap gap-1.5">
              <button type="button" onclick="toggleChip(this, 'Extra Spicy')" class="chip-btn text-xs px-2.5 py-1 rounded-full border border-gray-300 text-gray-600">🌶️ Extra Spicy</button>
              <button type="button" onclick="toggleChip(this, 'Less Spicy')" class="chip-btn text-xs px-2.5 py-1 rounded-full border border-gray-300 text-gray-600">🍃 Less Spicy</button>
              <button type="button" onclick="toggleChip(this, 'Add Cool Drinks')" class="chip-btn text-xs px-2.5 py-1 rounded-full border border-gray-300 text-gray-600">🥤 Cool Drink</button>
              <button type="button" onclick="toggleChip(this, 'Extra Tissues')" class="chip-btn text-xs px-2.5 py-1 rounded-full border border-gray-300 text-gray-600">🧻 Extra Tissues</button>
            </div>
            <textarea id="custom-notes" placeholder="Write custom comments..." class="w-full text-xs border rounded-lg p-2 mt-1 outline-none h-14 resize-none"></textarea>
          </div>

          <div class="border-t pt-3 space-y-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Mobile Number (Serves as Order ID)</label>
              <input id="cust-phone" type="tel" placeholder="10-digit Phone Number" class="w-full border rounded-lg p-2 text-sm outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Full Name</label>
              <input id="cust-name" type="text" placeholder="Your Name" class="w-full border rounded-lg p-2 text-sm outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Campus / Landmark</label>
              <select id="cust-landmark" onchange="handleLandmarkChange()" class="w-full border rounded-lg p-2 text-sm outline-none bg-white">
                <option value="GDGU">GD Goenka University (GDGU)</option>
                <option value="KRMU">K.R. Mangalam University (KRMU)</option>
                <option value="GLS">GLS Area</option>
                <option value="Sohna">Sohna Main Market</option>
                <option value="Other">Other Landmark...</option>
              </select>
            </div>
            <div id="other-landmark-box" class="hidden">
              <input id="cust-other-landmark" type="text" placeholder="Type landmark details..." class="w-full border rounded-lg p-2 text-sm outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Specific Address / Room No</label>
              <textarea id="cust-address" placeholder="Hostel Block, Room No / Floor" class="w-full border rounded-lg p-2 text-sm outline-none h-16 resize-none"></textarea>
            </div>
          </div>

          <div class="border-t pt-3 space-y-2">
            <div class="flex justify-between text-base font-bold text-amber-950">
              <span>Total Bill Amount</span>
              <span id="bill-total" class="text-amber-800">₹0</span>
            </div>
            <p class="text-xs text-gray-500 font-semibold">Payment Mode: Cash on Delivery (COD)</p>
          </div>

          <button onclick="placeOrder()" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3 rounded-xl shadow-lg transition block">
            Confirm Order
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/customer.js"></script>
</body>
</html>
