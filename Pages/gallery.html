<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery & Events - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-swiggy { background-color: #fc8019; }
    .text-swiggy { color: #fc8019; }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-swiggy text-white py-4 px-6 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/" class="font-extrabold text-2xl tracking-tight flex items-center space-x-2">
        <span class="bg-white text-swiggy px-2.5 py-0.5 rounded-xl text-lg">TM</span>
        <span>TRIPPY'S MEHFILL</span>
      </a>
      <a href="/" class="text-xs bg-black text-white px-4 py-2 rounded-xl font-bold">Back to Home</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-8">
    
    <!-- Admin Upload Section -->
    <div id="admin-upload-panel" class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="text-xl font-black text-gray-900">Upload Photos to Gallery / Slider</h2>
      
      <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-4 text-xs">
        <div>
          <label for="img-title" class="block font-bold text-gray-700 mb-1">Image Title</label>
          <input id="img-title" name="img-title" type="text" placeholder="e.g. VIP Guest Arrival" class="w-full border p-2.5 rounded-xl outline-none">
        </div>
        <div>
          <label for="img-section" class="block font-bold text-gray-700 mb-1">Section Type</label>
          <select id="img-section" name="img-section" class="w-full border p-2.5 rounded-xl outline-none bg-white font-bold">
            <option value="top_slider">CUH Top Auto-Slider (5s)</option>
            <option value="gallery_highlights">Gallery Highlights Card</option>
          </select>
        </div>
        <div>
          <label for="img-file" class="block font-bold text-gray-700 mb-1">Select File</label>
          <input id="img-file" name="img-file" type="file" accept="image/*" class="w-full text-xs">
        </div>
        <div class="flex items-end">
          <button id="btn-upload-photo" type="button" class="w-full bg-swiggy hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl uppercase transition cursor-pointer">
            Upload Image
          </button>
        </div>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div>
      <h2 class="text-2xl font-black text-gray-900 mb-4">Restaurant & Event Album</h2>
      <div id="full-gallery-grid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <p class="text-gray-400 text-xs py-8 col-span-full text-center">Loading gallery album...</p>
      </div>
    </div>

  </main>

  <script type="module">
  import { supabase } from '/JS/api.js';
  import { showToast } from '/JS/common.js';

  document.addEventListener('DOMContentLoaded', () => {
    loadGalleryAlbum();
    const btn = document.getElementById('btn-upload-photo');
    btn?.addEventListener('click', uploadPhotoHandler);
  });

  async function uploadPhotoHandler() {
    const titleInput = document.getElementById('img-title');
    const fileInput = document.getElementById('img-file');
    const sectionSelect = document.getElementById('img-section');
    const uploadBtn = document.getElementById('btn-upload-photo');

    if (!titleInput || !fileInput || !sectionSelect || !uploadBtn) return showToast('Upload form missing fields', 'error');

    const title = titleInput.value.trim();
    const section = sectionSelect.value;
    const file = fileInput.files[0];

    if (!title || !file) return showToast('Please provide a title and select an image file.', 'error');

    const fileName = `${Date.now()}_${file.name}`;
    try {
      uploadBtn.disabled = true;
      uploadBtn.innerText = 'Uploading...';

      const { error: storageError } = await supabase.storage
        .from('gallery-bucket')
        .upload(fileName, file);

      if (storageError) throw storageError;

      const { data: publicUrlData } = supabase.storage
        .from('gallery-bucket')
        .getPublicUrl(fileName);

      const imageUrl = publicUrlData.publicUrl;

      const { error: dbErr } = await supabase.from('gallery_images').insert([{
        title: title,
        image_url: imageUrl,
        section_type: section
      }]);

      if (dbErr) throw dbErr;

      showToast('🎉 Image uploaded successfully!');
      titleInput.value = '';
      fileInput.value = '';
      loadGalleryAlbum();
    } catch (err) {
      console.error(err);
      showToast('Upload failed: ' + (err.message || err), 'error');
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.innerText = 'Upload Image';
    }
  }

  async function loadGalleryAlbum() {
    const grid = document.getElementById('full-gallery-grid');
    if (!grid) return;

    grid.innerHTML = `<p class="text-gray-400 text-xs py-8 col-span-full text-center">Loading gallery album...</p>`;

    try {
      const { data: images, error } = await supabase.from('gallery_images').select('*').order('created_at', { ascending: false });

      if (error || !images || images.length === 0) {
        grid.innerHTML = `<p class="text-gray-400 text-xs col-span-full text-center py-8">No photos in the album yet.</p>`;
        return;
      }

      grid.innerHTML = images.map(img => `
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100">
          <img src="${img.image_url}" class="w-full h-48 object-cover" alt="${img.title}">
          <div class="p-3">
            <h4 class="font-bold text-gray-900 text-xs">${img.title}</h4>
            <span class="text-[10px] font-bold text-swiggy uppercase">${img.section_type}</span>
          </div>
        </div>
      `).join('');
    } catch (err) {
      console.error('Gallery load failed', err);
      grid.innerHTML = `<p class="text-gray-400 text-xs col-span-full text-center py-8">Failed to load gallery.</p>`;
      showToast('Failed to load gallery', 'error');
    }
  }
  </script>
</body>
</html>
