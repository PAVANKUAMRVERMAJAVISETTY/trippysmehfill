<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historic Orders - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans min-h-screen p-4 md:p-6">

  <!-- Admin Central Navigation -->
  <nav class="bg-amber-900 text-amber-100 p-4 rounded-2xl shadow-xl max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2 mb-6">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-black text-amber-400">TRIPPY'S MEHFILL</span>
      <span class="text-xs bg-amber-800 text-amber-200 px-2.5 py-1 rounded-full font-bold">Admin Portal</span>
    </div>
    <div class="flex space-x-2 text-xs font-bold">
      <a href="admin-dispatch.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🛵 Dispatch Desk</a>
      <a href="admin.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">📊 Analytics</a>
      <a href="admin-menu.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🍲 Menu Management</a>
      <a href="admin-orders.html" class="px-3 py-1.5 rounded-lg bg-amber-800 text-amber-200 border border-amber-600 shadow">📋 Order History</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto space-y-6">

    <!-- Filters Header Card -->
    <div class="bg-white p-5 rounded-2xl shadow border border-amber-100 flex flex-wrap gap-4 items-end text-xs max-w-5xl mx-auto">
      <div class="flex-1 min-w-[200px]">
        <label class="block font-bold text-gray-700 mb-1">Search Customer Phone</label>
        <input id="filter-phone" type="tel" placeholder="Enter phone number..." class="w-full border p-2.5 rounded-xl outline-none focus:border-amber-800 font-semibold">
      </div>

      <div class="min-w-[150px]">
        <label class="block font-bold text-gray-700 mb-1">Filter Landmark</label>
        <select id="filter-landmark" class="w-full border p-2.5 rounded-xl outline-none bg-white font-semibold">
          <option value="">All Locations</option>
          <option value="GDGU">GDGU</option>
          <option value="KRMU">KRMU</option>
          <option value="GLS">GLS</option>
          <option value="Sohna">Sohna Market</option>
        </select>
      </div>

      <div class="min-w-[150px]">
        <label class="block font-bold text-gray-700 mb-1">Filter Status</label>
        <select id="filter-status" class="w-full border p-2.5 rounded-xl outline-none bg-white font-semibold">
          <option value="">All Statuses</option>
          <option value="PENDING">PENDING</option>
          <option value="PREPARING">PREPARING</option>
          <option value="OUT FOR DELIVERY">OUT FOR DELIVERY</option>
          <option value="DELIVERED">DELIVERED</option>
        </select>
      </div>
    </div>

    <!-- Historical Orders Table -->
    <div class="bg-white rounded-2xl shadow overflow-hidden border border-amber-100 max-w-5xl mx-auto">
      <div class="p-4 bg-amber-900 text-amber-100 font-bold text-sm">Completed & Saved Database Registry</div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs md:text-sm">
          <thead>
            <tr class="bg-gray-100 border-b text-gray-700 uppercase text-xs">
              <th class="p-3">Order ID (Mobile)</th>
              <th class="p-3">Customer Name</th>
              <th class="p-3">Delivery Address</th>
              <th class="p-3">Items & Pricing</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Status</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="divide-y">
            <tr>
              <td colspan="7" class="p-6 text-center text-gray-400 font-bold">Querying order history...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script type="module" src="../JS/admin-orders.js"></script>
</body>
</html>
