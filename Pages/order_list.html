<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales List & Breakdown - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans min-h-screen p-4 md:p-6">

  <!-- Admin Central Navigation -->
  <nav class="bg-amber-900 text-amber-100 p-4 rounded-2xl shadow-xl max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2 mb-6">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-black text-amber-400">TRIPPY'S MEHFILL</span>
      <span class="text-xs bg-amber-800 text-amber-200 px-2.5 py-1 rounded-full font-bold">Metrics Desk</span>
    </div>
    <div class="flex space-x-2 text-xs font-bold">
      <a href="admin-dispatch.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🛵 Dispatch Desk</a>
      <a href="admin.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">📊 Analytics</a>
      <a href="admin-menu.html" class="px-3 py-1.5 rounded-lg hover:bg-amber-800 text-amber-100 transition">🍲 Menu Management</a>
      <a href="orders_list.html" class="px-3 py-1.5 rounded-lg bg-amber-800 text-amber-200 border border-amber-600 shadow">📈 Financial Stats</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto space-y-6">
    
    <!-- Interactive Period Selection Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
      
      <!-- Card Today -->
      <div id="card-today" class="bg-white p-5 rounded-2xl shadow border hover:shadow-md cursor-pointer transition text-center space-y-1">
        <p class="text-xs text-gray-500 uppercase font-bold">TODAY</p>
        <p id="stat-today-count" class="text-base font-bold text-amber-950">0 Orders</p>
        <p id="stat-today-revenue" class="text-2xl font-black text-green-700">₹0</p>
      </div>

      <!-- Card Week -->
      <div id="card-week" class="bg-white p-5 rounded-2xl shadow border hover:shadow-md cursor-pointer transition text-center space-y-1">
        <p class="text-xs text-gray-500 uppercase font-bold">THIS WEEK (7 DAYS)</p>
        <p id="stat-week-count" class="text-base font-bold text-amber-950">0 Orders</p>
        <p id="stat-week-revenue" class="text-2xl font-black text-green-700">₹0</p>
      </div>

      <!-- Card Month -->
      <div id="card-month" class="bg-white p-5 rounded-2xl shadow border hover:shadow-md cursor-pointer transition text-center space-y-1">
        <p class="text-xs text-gray-500 uppercase font-bold">THIS MONTH (30 DAYS)</p>
        <p id="stat-month-count" class="text-base font-bold text-amber-950">0 Orders</p>
        <p id="stat-month-revenue" class="text-2xl font-black text-green-700">₹0</p>
      </div>

    </div>

    <!-- Active dynamic breakdown container -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-100 space-y-4 max-w-3xl mx-auto">
      <div class="border-b pb-2 border-amber-200">
        <h2 id="active-period-label" class="font-black text-amber-950 text-base">Sales Itemized Breakdown: TODAY</h2>
        <p class="text-[10px] text-gray-400 font-bold uppercase mt-0.5">Click any metric card above to switch time periods</p>
      </div>

      <!-- Aggregated items load here -->
      <div id="item-breakdown-list" class="grid sm:grid-cols-2 gap-4">
        <p class="text-gray-400 text-center py-6 text-xs col-span-2">Analyzing product sales...</p>
      </div>
    </div>

  </main>

  <script type="module" src="../JS/orders_list.js"></script>
</body>
</html>
