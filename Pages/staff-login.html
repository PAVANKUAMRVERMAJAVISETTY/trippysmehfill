<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-950 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center space-y-5">
    <div class="inline-block bg-amber-100 text-amber-900 font-black px-4 py-2 rounded-2xl text-2xl">TM</div>
    <h1 class="text-2xl font-black text-amber-950">Trippy's Staff Gateway</h1>
    <p class="text-xs text-gray-500">Enter your credentials to access staff & admin controls</p>
    
    <form id="staff-login-form" class="space-y-4">
      <input id="login-email" type="email" placeholder="Email Address" required class="w-full border border-gray-300 p-3 rounded-xl text-xs outline-none focus:ring-2 focus:ring-amber-800">
      <input id="login-pass" type="password" placeholder="Password" required class="w-full border border-gray-300 p-3 rounded-xl text-xs outline-none focus:ring-2 focus:ring-amber-800">
      <button type="submit" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-extrabold py-3 rounded-xl text-xs uppercase shadow-lg transition">
        Login to Gateway
      </button>
    </form>
  </div>

  <script type="module" src="../JS/login_index.js"></script>
</body>
</html>
