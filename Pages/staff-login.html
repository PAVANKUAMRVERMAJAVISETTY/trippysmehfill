<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login - Trippy's Mehfill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white p-6 rounded-3xl shadow-xl border border-amber-100 space-y-6">
    <div class="text-center space-y-1 border-b pb-4">
      <h1 class="text-2xl font-black text-amber-950 tracking-wider">TRIPPY'S MEHFILL</h1>
      <p class="text-xs text-amber-800 font-bold uppercase">Staff & Management Gateway</p>
    </div>

    <div class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-gray-700 mb-1">Username / Identifier</label>
        <input id="login-username" type="text" placeholder="Enter your staff Username" class="w-full border p-3 rounded-xl outline-none focus:border-amber-800 font-semibold">
      </div>

      <div>
        <label class="block font-bold text-gray-700 mb-1">Password</label>
        <input id="login-password" type="password" placeholder="Enter your Passcode" class="w-full border p-3 rounded-xl outline-none focus:border-amber-800 font-semibold">
      </div>

      <button id="btn-staff-login" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3.5 rounded-xl shadow transition active:scale-95 text-xs">
        🔑 Log In to Dashboard
      </button>
    </div>

    <div class="text-center">
      <a href="../index.html" class="text-xs text-amber-800 hover:underline font-semibold">← Return to Customer Storefront</a>
    </div>
  </div>

  <script type="module">
    import { handleLogin } from "../JS/auth.js";
    
    document.getElementById("btn-staff-login").addEventListener("click", () => {
      const user = document.getElementById("login-username").value.trim();
      const pass = document.getElementById("login-password").value.trim();
      if(user && pass) {
        handleLogin(user, pass);
      } else {
        alert("Please fill in both fields!");
      }
    });
  </script>
</body>
</html>
